
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration | BloodLink</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <main class="login-page">

        <div class="login-container">

            <div class="login-brand">
                <div class="brand-icon">B</div>
                <h1>BloodLink</h1>
                <p>Donor Registration</p>
            </div>

            <form id="registerForm" class="login-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Minimum 8 characters"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="72"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleRegisterPassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg
                                id="registerEyeIcon"
                                xmlns="http://www.w3.org/2000/svg"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >
                    Create Donor Account
                </button>

                <p id="registerMessage" class="message" role="status"></p>

            </form>

            <div class="login-footer">
                <p>Already registered?
                    <a href="/login.html">Log in</a>
                </p>
            </div>

        </div>

    </main>

    <script src="/register.js"></script>

    <script>
        const registerPassword = document.getElementById("password");
        const toggleRegisterPassword = document.getElementById("toggleRegisterPassword");
        const registerEyeIcon = document.getElementById("registerEyeIcon");

        toggleRegisterPassword.addEventListener("click", () => {
            const isHidden = registerPassword.type === "password";

            registerPassword.type = isHidden ? "text" : "password";

            toggleRegisterPassword.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );

            toggleRegisterPassword.setAttribute(
                "aria-pressed",
                String(isHidden)
            );

            registerEyeIcon.innerHTML = isHidden
                ? `
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7s-3.5 7-10 7a10 10 0 0 1-3.4-.6"/>
                    <path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.5 7 10 7"/>
                `
                : `
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
        });
    </script>

</body>
</html>
